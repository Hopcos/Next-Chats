<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#141b3d"/>
    </linearGradient>
    <linearGradient id="inf" x1="8" y1="40" x2="56" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 深空底板 -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.5" fill="none" stroke="#818cf8" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- 中心辉光 -->
  <circle cx="32" cy="32" r="26" fill="url(#glow)"/>

  <!-- 无限符号：未来感霓虹描边 -->
  <path
    d="M32 32c-4.2-6.4-8.1-9.6-12.3-9.6C15 22.4 11.5 26.6 11.5 32S15 41.6 19.7 41.6c4.2 0 8.1-3.2 12.3-9.6Zm0 0c4.2 6.4 8.1 9.6 12.3 9.6 4.7 0 8.2-4.2 8.2-9.6s-3.5-9.6-8.2-9.6C40.1 22.4 36.2 25.6 32 32Z"
    fill="none" stroke="url(#inf)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 交汇点火花 -->
  <circle cx="32" cy="32" r="2.4" fill="#e0f2fe"/>

  <!-- 星尘点缀 -->
  <g fill="#a5b4fc">
    <circle cx="10" cy="12" r="1.3"/>
    <circle cx="54" cy="50" r="1.3" opacity="0.85"/>
  </g>
  <g fill="#67e8f9">
    <circle cx="49.5" cy="13.5" r="1.7" opacity="0.9"/>
    <circle cx="14.5" cy="50.5" r="1" opacity="0.7"/>
  </g>
  <path d="M44 9.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9.9-2.1Z" fill="#f0abfc" opacity="0.95"/>
  <path d="M20 53.5l.7 1.6 1.6.7-1.6.7-.7 1.6-.7-1.6-1.6-.7 1.6-.7.7-1.6Z" fill="#7dd3fc" opacity="0.8"/>
